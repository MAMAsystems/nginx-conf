map $server_name $log_mamasystems {
    default 0;
    mamasystems.de 1;
}
log_format mamasystems_analytics
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" $host $request_time';
access_log /var/log/nginx/mamasystems-access.log mamasystems_analytics if=$log_mamasystems;

server {
    listen 127.0.0.1:8091;
    server_name localhost;
    access_log off;
    root /var/lib/mama-goaccess;

    location = / {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
