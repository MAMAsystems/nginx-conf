map $server_name $log_mamasystems {
    default 0;
    mamasystems.de 1;
}
access_log /var/log/nginx/mamasystems-access.log combined if=$log_mamasystems;

server {
    listen 127.0.0.1:8091;
    server_name localhost;
    access_log off;
    root /var/lib/mama-goaccess;

    location = / {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
